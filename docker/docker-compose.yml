version: '3.7'

networks:
  net_dev:
    external: true

services:
  films-db:
    image: postgres:15.3-alpine
    restart: always
    ports:
      - '5439:5432'
    volumes:
      - ./volumes/db:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres

  films-service:
    image: aladiev/films
    restart: always
    ports:
      - 3101:3000
    environment:
      - PG_CONNECTION_STRING=postgresql://postgres:postgres@films-db:5432/postgres
    depends_on:
      - films-db

  auth-db:
    image: mongo
    restart: always
    ports:
      - 27017:27017
    volumes:
      - .\volumes\mongo:/data/db

  # mongo-seed:
  #   build: .\seed
  #   depends_on:
  #     - users-db

  auth-service:
    image: aladiev/auth
    restart: always
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MONGO_HOST=auth-db
      - MONGO_PORT=27017
    ports:
      - 3102:3000
    depends_on:
      - auth-db
      - redis

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - .\volumes\redis:/data
